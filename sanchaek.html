<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동명 산책</title>
<style>
@font-face{font-family:'Pretendard';font-weight:300;font-display:block;src:url('fonts/Pretendard-Light.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:500;font-display:block;src:url('fonts/Pretendard-Medium.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700;font-display:block;src:url('fonts/Pretendard-Bold.woff2') format('woff2')}
@font-face{font-family:'NanumMyeongjo';font-weight:700;font-display:block;src:url('fonts/NanumMyeongjo-Bold.ttf') format('truetype')}
:root{--u:max(1vw,11px);--bg:#FEEFE7;--paper:#F2EFE6;--muted:rgba(242,239,230,.62);--line:rgba(242,239,230,.18);--c4:#F5C518;
  --sans:'Pretendard','Malgun Gothic',sans-serif;--serif:'NanumMyeongjo','Batang',serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{background:var(--bg);font-family:var(--sans);font-weight:300;user-select:none;-webkit-user-select:none;position:relative}
/* 그림은 화면 전체, 버튼은 그 위에 반투명으로 떠 있음 */
#stage{position:absolute;inset:0;overflow:hidden;cursor:grab}
#stage.drag{cursor:grabbing}
/* 그림과 학생이 함께 움직이는 판 — 좌표는 그림 가로 1536 기준 */
#world{position:absolute;left:0;top:0;width:1536px;height:1024px;transform-origin:0 0}
/* 그림 가장자리를 바탕색으로 부드럽게 녹여 경계선이 보이지 않게 */
#world #pic{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;
  /* 좌우 폭은 1.5%만 — 9%였을 때 받침대 왼쪽 나무까지 흐려져 그 위 가림 조각과 어긋나 보였음 */
  -webkit-mask:linear-gradient(90deg,transparent,#000 1.5%,#000 98.5%,transparent),linear-gradient(transparent,#000 4%,#000 96%,transparent);
  -webkit-mask-composite:source-in;mask-composite:intersect}
/* 학생 크기 — 큰 화면 전체 모습에서도 알아보이게 건물 한 층보다 조금 작게 */
/* 학생 — ChatGPT로 만든 그림을 동작별 칸(작은동명/학생_*_칸.png)으로 나눠 씁니다. 발끝이 기준점 */
.kid{position:absolute;left:0;top:0;pointer-events:none}
.kid .spr{position:absolute;left:0;bottom:0;width:100%;height:100%;background-repeat:no-repeat;background-size:700% 100%}
.kid .shadow{position:absolute;left:18%;bottom:-6%;width:64%;height:12%;border-radius:50%;background:rgba(90,50,30,.22)}
.kid.hop .spr{animation:hop .8s ease-out}
/* 삼색 고양이 — 칸 그림 9장 */
.cat{position:absolute;left:0;top:0;pointer-events:none;transition:opacity .6s}
/* 옛 동명 선배 — 나타나고 사라질 때 서서히. 옛날 교복 그림이 아직 없으면 지금 학생 그림을 빛바랜 사진 색으로 */
.kid{transition:opacity .8s}
/* 체육대회 머리띠 — 청팀 파랑, 백팀 흰색 */
.kid .band{position:absolute;left:25%;top:10%;width:50%;height:4.5%;border-radius:99px;pointer-events:none}
.kid .band.b0{background:#2f6fd6}
.kid .band.b1{background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.35)}
/* 계절 소품 — 발끝(아래 가운데)이 놓을 자리. 눌렀을 때 살짝 흔들림 */
.prop{position:absolute;transform:translate(-50%,-100%);pointer-events:none;transform-origin:50% 100%}
.prop.wig{animation:wig .6s ease-out}
@keyframes wig{0%,100%{transform:translate(-50%,-100%) rotate(0)}25%{transform:translate(-50%,-100%) rotate(-6deg)}60%{transform:translate(-50%,-100%) rotate(4deg)}}
.prop.xmas{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18) saturate(1.15)}}
/* 날아다니는 나비·잠자리와 참새 — 위치는 스크립트, 날갯짓은 CSS */
.critter{position:absolute;left:0;top:0;pointer-events:none;transition:opacity .5s}
.critter img{display:block;width:100%;height:100%}
.critter.flap img{animation:flap .18s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.45)}}
/* 흩날리는 꽃잎·낙엽·눈 — 화면 위에서 천천히. transform·opacity 만 움직여 가볍게 */
#fall{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
#fall i{position:absolute;top:calc(-3*var(--u));display:block;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}
.kid.old .spr{filter:sepia(.75) saturate(.7) brightness(.95)}
.cat .spr{position:absolute;left:0;bottom:0;width:100%;height:100%;background-repeat:no-repeat;background-size:900% 100%}
.cat .shadow{position:absolute;left:15%;bottom:-6%;width:70%;height:14%;border-radius:50%;background:rgba(90,50,30,.22)}
/* 깡충 — transform 대신 translate 만 움직임. transform 을 쓰면 오른쪽을 보게 뒤집어 둔 그림(scaleX(-1))이 점프하는 동안 풀려 왼쪽을 봤음 (2026-10-25) */
@keyframes hop{0%{translate:0 0}25%{translate:0 -28%}50%{translate:0 0}70%{translate:0 -12%}100%{translate:0 0}}
.head{position:absolute;left:calc(2*var(--u));top:calc(1.6*var(--u));pointer-events:none;padding:calc(1*var(--u)) calc(1.6*var(--u)) calc(1.1*var(--u));border-radius:calc(1*var(--u));
  background:rgba(255,255,255,.75);color:#12357F;box-shadow:0 calc(.4*var(--u)) calc(1.4*var(--u)) rgba(60,30,20,.16);z-index:3}
.head h1{font-family:var(--serif);font-weight:700;font-size:calc(2.6*var(--u));letter-spacing:.1em}
.head p{margin-top:calc(.5*var(--u));font-size:calc(1.3*var(--u));opacity:.92}
/* 말풍선 글자는 모두 calc(1.3*var(--u))(약 16mm)로 통일, 최대 폭 calc(19*var(--u)) — 긴 말은 두 줄, 낱말 중간에서 끊지 않음.
   말·혼잣말·맞장구는 글자 크기가 아니라 모양(꼬리·글자색)으로만 구분 */
.bub{position:absolute;transform:translate(-50%,-100%);pointer-events:none;width:max-content;max-width:calc(19*var(--u));text-align:center;
  word-break:keep-all;line-height:1.35;z-index:2;
  padding:calc(.7*var(--u)) calc(1.2*var(--u));border-radius:calc(1.2*var(--u));background:#fff;color:#1b2440;font-size:calc(1.3*var(--u));font-weight:500;
  box-shadow:0 calc(.5*var(--u)) calc(1.5*var(--u)) rgba(0,0,0,.2);transition:opacity .3s linear}
.bub.sm{padding:calc(.55*var(--u)) calc(1*var(--u))}
.bub.notail::after{display:none}              /* 체육대회 승리 발표처럼 누가 말하는 게 아닌 말풍선 */
/* 혼잣말 — 생각 풍선: 흐린 글자, 꼬리 대신 작은 동그라미 두 개 */
.bub.think{color:#4a5170;border-radius:calc(1.6*var(--u));background:rgba(255,255,255,.93)}
.bub.think::after,.bub.think::before{content:'';position:absolute;left:50%;border:0;border-radius:50%;background:rgba(255,255,255,.93);
  box-shadow:0 calc(.2*var(--u)) calc(.5*var(--u)) rgba(0,0,0,.15)}
.bub.think::after{bottom:calc(-.75*var(--u));width:calc(.75*var(--u));height:calc(.75*var(--u));margin-left:calc(-.15*var(--u))}
.bub.think::before{bottom:calc(-1.25*var(--u));width:calc(.4*var(--u));height:calc(.4*var(--u));margin-left:calc(.35*var(--u))}
/* 고양이가 짜증 나서 달아날 때 머리 위에 뜨는 만화식 꼬불꼬불 낙서 뭉치 (말풍선 없이) */
/* 말풍선 안에 꼬불꼬불 낙서, 그 오른쪽 위에 작은 빨간 핏줄 표시(💢) */
.bub.grr{padding:calc(.75*var(--u)) calc(1.05*var(--u)) calc(.6*var(--u)) calc(.9*var(--u))}
.grr svg{display:block;width:calc(2.6*var(--u));animation:grr .16s steps(2) infinite}
/* ChatGPT 짜증 말풍선 그림(작은동명/짜증_1.png 핏줄, 짜증_2.png 낙서, 짜증_3.png 화난 고양이 얼굴) — 그림 자체에 말풍선·꼬리가 있어 바탕·꼬리를 뺌 */
.bub.grrimg{background:none;box-shadow:none;padding:0}
.bub.grrimg::after{display:none}
.bub.grrimg img{display:block;width:calc(4.4*var(--u));animation:grr .18s steps(2) infinite}
.grr svg.vein{position:absolute;right:calc(.8*var(--u));top:calc(.5*var(--u));width:calc(1.05*var(--u));animation-duration:.22s}
@keyframes grr{0%{transform:rotate(-6deg) translate(-2%,0)}100%{transform:rotate(6deg) translate(2%,-3%)}}
.bub::after{content:'';position:absolute;left:50%;bottom:calc(-.9*var(--u));margin-left:calc(-.8*var(--u));border:calc(.8*var(--u)) solid transparent;border-top-color:#fff;border-bottom:0}
.lab{position:absolute;transform:translate(-50%,-100%) scale(.6);pointer-events:none;white-space:nowrap;z-index:2;
  padding:calc(.7*var(--u)) calc(1.5*var(--u));border-radius:calc(99*var(--u));background:#fff;color:#12357F;font-size:calc(1.6*var(--u));font-weight:700;
  box-shadow:0 calc(.5*var(--u)) calc(1.5*var(--u)) rgba(0,0,0,.22);opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.lab.on{opacity:1;transform:translate(-50%,-100%) scale(1)}

/* 아래 떠 있는 버튼들 — 흰색 75% 반투명 (뒤 흐림 효과는 4K에서 무거워서 쓰지 않음) */
.reach{position:absolute;left:calc(2*var(--u));right:calc(2*var(--u));bottom:calc(1.4*var(--u));display:flex;align-items:center;gap:calc(1*var(--u));pointer-events:none;z-index:4}
.reach>*{pointer-events:auto}
.glass{background:rgba(255,255,255,.75);box-shadow:0 calc(.4*var(--u)) calc(1.4*var(--u)) rgba(60,30,20,.16);color:#12357F}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.btn{padding:calc(1.5*var(--u)) calc(2.6*var(--u));border-radius:calc(99*var(--u));font-size:calc(1.5*var(--u));font-weight:500;white-space:nowrap}
.btn:active,.chips button:active{background:rgba(255,255,255,.95)}
.grp{display:flex;align-items:center;gap:calc(.7*var(--u));padding:calc(.6*var(--u)) calc(.7*var(--u)) calc(.6*var(--u)) calc(1.6*var(--u));border-radius:calc(99*var(--u))}
.grp .lb{font-size:calc(1.15*var(--u));font-weight:500;color:rgba(18,53,127,.7);margin-right:calc(.3*var(--u))}
.chips{display:flex;gap:calc(.6*var(--u))}
.chips button{padding:calc(1.1*var(--u)) calc(1.9*var(--u));border-radius:calc(99*var(--u));font-size:calc(1.3*var(--u));font-weight:500;color:#12357F}
.chips button.sel{background:var(--c4);color:#221a08;font-weight:700}
.chips button[disabled]{opacity:.35}
.spacer{flex:1}
/* 소나기 — 화면을 살짝 어둡게 하고 비스듬한 빗줄기 */
#rain{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;opacity:0;transition:opacity 1.5s;background:rgba(60,75,110,.24)}
#rain.on{opacity:1}
#rain i{position:absolute;top:-12vh;width:calc(.16*var(--u));height:calc(4.5*var(--u));background:linear-gradient(transparent,rgba(150,180,225,.95));
  transform:rotate(12deg);animation:rainfall linear infinite}
@keyframes rainfall{to{transform:translate3d(-14vh,125vh,0) rotate(12deg)}}
/* 눈싸움 눈뭉치 — 그림 좌표(#world) 안에서 날아감 */
.snowball{position:absolute;left:0;top:0;width:3.2px;height:3.2px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 .35px rgba(110,130,170,.7);pointer-events:none}
/* 숨은 재미 발견 알림 — 조작줄 바로 위 가운데에 잠깐 */
#toast{position:absolute;left:50%;bottom:calc(8.6*var(--u));transform:translate(-50%,calc(1*var(--u)));padding:calc(1*var(--u)) calc(2.2*var(--u));border-radius:calc(99*var(--u));
  font-size:calc(1.5*var(--u));font-weight:700;white-space:nowrap;opacity:0;pointer-events:none;z-index:5;transition:opacity .3s,transform .3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* 숨은 재미 찾은 수 — 오른쪽 위 구석. 찾을 때마다 점이 하나씩 채워지고 살짝 커졌다 돌아옴 (2026-10-29 사용자 요청: 도전 의식) */
#funs{position:absolute;right:calc(2*var(--u));top:calc(1.6*var(--u));z-index:3;pointer-events:none;padding:calc(1*var(--u)) calc(1.6*var(--u)) calc(1.1*var(--u));border-radius:calc(1*var(--u));text-align:right}
#funs .t{font-size:calc(1.3*var(--u));font-weight:500;color:rgba(18,53,127,.8)}
#funs .t b{font-family:var(--serif);font-size:calc(2.4*var(--u));font-weight:700;color:#12357F;margin:0 calc(.3*var(--u)) 0 calc(.5*var(--u))}
#funs .dots{display:flex;gap:calc(.45*var(--u));justify-content:flex-end;margin-top:calc(.5*var(--u))}
#funs .dots i{width:calc(.9*var(--u));height:calc(.9*var(--u));border-radius:50%;border:calc(.15*var(--u)) solid rgba(18,53,127,.45)}
#funs .dots i.on{background:var(--c4);border-color:#d9a400}
#funs.pop{animation:pop .6s ease-out}
@keyframes pop{30%{transform:scale(1.15)}}
/* 휴대폰 — 글자·버튼 크기 단위 --u 가 최소 11px 이라 큰 화면처럼 한 줄에 다 안 들어감.
   폭 700px 이하에서는 계절 버튼을 윗줄 가운데로, 처음 모습·닫기를 아랫줄 양끝으로 (2026-10-30) */
@media (max-width:700px){
  .reach{flex-wrap:wrap;row-gap:calc(1*var(--u))}
  .reach .grp{order:-1;flex:1 0 100%;justify-content:center}
  #toast{bottom:calc(15*var(--u))}
}
</style>
</head>
<body>
<div id="stage">
  <div id="world"><img id="pic" src="작은동명/봄.jpg" alt="동명 학교 모형"></div>
  <div class="head"><h1>동명 산책</h1><p>학생이나 건물을 눌러 보세요</p></div>
  <div id="funs" class="glass"><div class="t">숨은 재미<b id="funN">0</b>/ <span id="funAll">8</span> 찾음</div><div class="dots" id="funDots"></div></div>
  <div id="fall"></div>
</div>
<div class="reach" id="reach">
  <button class="btn glass" onclick="viewHome()">처음 모습</button>
  <div class="spacer"></div>
  <div class="grp glass"><span class="lb">계절</span><div class="chips" id="seasons"></div></div>
  <div class="spacer"></div>
  <button class="btn glass" id="closeBtn">닫기</button>
</div>
<div id="toast" class="glass"></div>

<script src="작은동명/학생.js"></script>
<script src="작은동명/가림.js"></script>
<script src="작은동명/고양이.js"></script>
<script>
/* ═══ 동명 산책 (2026-10-30 '작은 동명 산책'에서 이름 바꿈. 그림 폴더 이름 '작은동명'은 그대로) ═══
   ChatGPT로 만든 계절별 학교 그림(작은동명/봄·여름·가을·겨울.jpg, 6144×4096) 위에 학생·고양이·소품이 움직입니다.
   좌표는 그림을 가로 1536으로 본 기준입니다. 파일 역할·숨은 재미 목록은 작은동명/작업정리.md */
const $=id=>document.getElementById(id);
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const pick=a=>a[Math.floor(rnd()*a.length)];

/* ── 걷는 길 — 그림의 보도를 따라 이은 점들 ── */
const NODES={
  a1:[262,212],a2:[290,236],a3:[330,288],a4:[400,322],a5:[455,372],a6:[500,420],a7:[545,470],a8:[600,525],
  a9:[660,575],a10:[722,624],a11:[762,642],a12:[860,702],
  b1:[215,578],b2:[330,556],b3:[440,535],b4:[560,515],
  d1:[940,668],d2:[1020,634],d3:[1100,601],d4:[1175,570],d5:[1240,545],d6:[1180,500],d7:[1135,470],
  e1:[1265,588],e2:[1270,628],e3:[1200,660],e4:[1120,700],e5:[1040,740],e6:[980,772],
  f1:[872,738],f2:[902,772],f3:[942,802],f4:[985,834],
};
const EDGES='a1-a2 a2-a3 a3-a4 a4-a5 a5-a6 a6-a7 a7-a8 a8-a9 a9-a10 a10-a11 b1-b2 b2-b3 b3-b4 b4-a8 '+
  'a12-d1 d1-d2 d2-d3 d3-d4 d4-d5 d5-d6 d6-d7 d5-e1 e1-e2 e2-e3 e3-e4 e4-e5 e5-e6 a12-f1 f1-f2 f2-f3 f3-f4 e6-f3';
const NB={};EDGES.split(' ').forEach(e=>{const [a,b]=e.split('-');(NB[a]=NB[a]||[]).push(b);(NB[b]=NB[b]||[]).push(a)});
/* 운동장 — 기울어진 타원 안 (조회대 둘레는 빼고) */
const FIELD={cx:870,cy:478,a:200,b:78,ang:21.3*Math.PI/180};
/* 조회대(뾰족한 지붕) 자리 — 학생 발이 이 안에 들어가면 지붕 앞에 그려져 어색하므로 아예 지나가지 않게.
   그림의 조회대보다 조금 넉넉하게 잡은 다각형 */
const STAGE=[[676,440],[800,432],[868,515],[866,628],[796,634],[674,532]];
function inStage(x,y){let c=false;for(let i=0,j=STAGE.length-1;i<STAGE.length;j=i++){const [xi,yi]=STAGE[i],[xj,yj]=STAGE[j];
  if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function crossesStage(x1,y1,x2,y2){const n=Math.ceil(Math.hypot(x2-x1,y2-y1)/1.5);
  for(let i=0;i<=n;i++)if(inStage(x1+(x2-x1)*i/n,y1+(y2-y1)*i/n))return true;return false}
/* 운동장 안 목적지 — 조회대 자리가 아니고, (지금 위치가 있으면) 가는 길이 조회대를 가로지르지 않는 곳 */
function fieldSpot(fx,fy){
  for(let tries=0;;tries++){if(fx!==undefined&&tries>300)return [fx,fy];      /* 못 찾으면 제자리 */
    const t=rnd()*6.283,r=Math.sqrt(rnd()),u=Math.cos(t)*FIELD.a*r,v=Math.sin(t)*FIELD.b*r;
    const x=FIELD.cx+u*Math.cos(FIELD.ang)-v*Math.sin(FIELD.ang),y=FIELD.cy+u*Math.sin(FIELD.ang)+v*Math.cos(FIELD.ang);
    if(inStage(x,y))continue;

    return;
  }
  if(P.phase==='finish'&&P.t>3.5){
    P.phase='back';say(pick(P.S),'수고했어!',2);
    for(const k of P.L){const to=homeOf(k);teamBand(k,-1);k.mode='back';k.way=routeTo(k.x,k.y,to[0],to[1])}
    teacherBack(TM);
    return;
  }
  if(P.phase==='back'&&P.L.every(k=>k.mode!=='back'))sports=null;
}
function restoreKid(k){
  const m=k.save.mode;k.mode=m;k.tx=k.x;k.ty=k.y;k.wait=rnd()*2;k.spr.style.marginBottom='0px';
  if(m==='sit'){k.face=1;k.x=k.sx;k.y=k.sy;setFrame(k,6,true)}   /* 벤치 자리에 정확히 다시 앉음 */else if(m==='wave'){k.face=-1;setFrame(k,5,false)}
  else if(m==='chat'){k.face=k.save.face;setFrame(k,0,k.face>0)}else setFrame(k,0,k.face>0);
}

/* ── 숨은 재미 ③ 옛 동명 선배 — 기념관(한옥)을 연달아 세 번(TAPS) 누르면 옛날 교복 학생이 한옥 옆에서 나와
   꽃밭까지 거닐며 인사하고 다시 한옥 쪽으로 사라짐. 옛날 교복 그림(학생옛날_단발)이 오기 전에는 지금 그림을 빛바랜 색으로 */
const HIDE=[188,428];                          /* 한옥 오른쪽 아래 덤불 — 선배와 고양이가 사라지고 나타나는 곳 */
const OLDSAY=['후배들 반가워!','동명 100주년 축하해!','교복 멋지지?'];
const SOUT=[226,421];                          /* 덤불 오른쪽, 보도 위쪽 가장자리 — 선배가 덤불에서 옆으로 걸어 나오는 첫 점 */
let senior=null;
function summonSenior(){
  if(senior)return;found('senior');
  const st=ART['옛날단발']?'옛날단발':'단발',k=makeKid('senior',HIDE,st);
  if(st==='단발')k.el.classList.add('old');
  k.el.style.opacity=0;setTimeout(()=>k.el.style.opacity=1,40);
  /* 앞모습으로 나오게 — 덤불에서 앞을 보고 잠깐 선 뒤, 보도 위쪽 가장자리(SOUT)를 따라 옆으로 걸어 나옴.
     예전엔 덤불 → c1(위쪽)로 곧장 올라가 뒷모습부터 보였음 (2026-10-29 사용자 요청). 옆으로 걷는 동안은 앞모습(walkWay) */
  k.speed=12;k.way=[SOUT,CATN.c6,CATN.c2,CATN.c1,HIDE];k.pause=1.5;k.face=1;setFrame(k,0,true);
  place(k);senior=k;
}
function stepSenior(k,dt){
  if(k.pause>0){k.pause-=dt;setFrame(k,k.pause>2.6?5:0,k.face>0);k.spr.style.marginBottom='0px';place(k);return}
  const n=k.way.length;
  if(walkWay(k,dt,1)){k.el.remove();if(k.bub)k.bub.remove();k.dead=true;senior=null;return}
  if(k.way.length<n){                          /* 점 하나에 닿았을 때 */
    if(k.way.length===4)say(k,'옛날 동명 선배야!',3);
    if(k.way.length===3){k.pause=4;k.face=-1;say(k,pick(OLDSAY),3.5)}
    if(k.way.length===1)k.el.style.opacity=0;
  }
  place(k);
}
/* 학생이 원래 하던 일로 돌아갈 자리 — 체육대회·수업 종이 끝났을 때 같이 씀 */
function homeOf(k){
  if(k.tch)return k===TF?TN.g3:fieldSpot(k.x,k.y);   /* 여자 선생님은 잔디 길로 돌아가 다시 길 점을 따라 거닒 */
  const m=k.save.mode;
  if(m==='follow')return NODES[k.lead.node];   /* 친구도 친구가 갈 곳으로 간 뒤 다시 따라 걷기 */
  if(m==='path')return NODES[k.node];if(m==='field')return fieldSpot(k.x,k.y);if(m==='jog')return jogAt(k.ang);return [k.save.x,k.save.y];
}

/* ── 숨은 재미 ④ 수업 종 — 성실관을 연달아 세 번(TAPS) 누르면 '딩동댕동' 종소리(소리만, 그림에 종은 없음)가 나고
   학생들이 가까운 출입구로 뛰어 들어갔다가 잠시 뒤 '쉬는 시간이다!' 하며 다시 나와 하던 일로 돌아감 (2026-10-24) ──
   출입구: 성실관 현관 계단, 창조관 동쪽 끝과 향상관이 만나는 어두운 안쪽 모서리 (사용자 지정 2026-10-24 — 처음엔 차양 아래 두 곳이었음)
   들어갈 때 사라지고 나올 때 나타나는 곳이 같음 (향상관·경영고는 그림에 현관이 안 보여서 뺌) */
const DOORS=[[568,246],[1200,402]];
let bell=null;
function chime(){                              /* 딩동댕동 — 미·도·레·솔, 전시장이라 작게 */
  try{const C=ac();if(!C)return;const t0=C.currentTime+.01;
    [659.3,523.3,587.3,392].forEach((f,i)=>{for(const [m,a] of [[1,.16],[2.76,.035]]){
      const o=C.createOscillator(),g=C.createGain(),t=t0+i*.6;o.type='sine';o.frequency.value=f*m;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.01);g.gain.exponentialRampToValueAtTime(.0005,t+1.4);
      o.connect(g).connect(C.destination);o.start(t);o.stop(t+1.5)}})}catch(e){}
}
function doorWay(k){                           /* 출입구까지 — 길 위 학생은 길을 따라, 나머지는 가까운 출입구로 곧장 */
  if(k.mode==='path'&&k.node){
    const D=/^[ab]/.test(k.node)?DOORS[0]:DOORS[1],prev={[k.node]:null},q=[k.node];let best=k.node;
    while(q.length){const n=q.shift();if(Math.hypot(NODES[n][0]-D[0],NODES[n][1]-D[1])<Math.hypot(NODES[best][0]-D[0],NODES[best][1]-D[1]))best=n;
      for(const m of NB[n])if(!(m in prev)){prev[m]=n;q.push(m)}}
    const p=[];for(let n=best;n;n=prev[n])p.unshift(NODES[n]);return [...p,D];
  }
  const D=DOORS.reduce((a,b)=>Math.hypot(a[0]-k.x,a[1]-k.y)<Math.hypot(b[0]-k.x,b[1]-k.y)?a:b);
  return routeTo(k.x,k.y,D[0],D[1]);
}
function ringBell(){
  if(busy())return;found('bell');
  const L=pupils().filter(k=>k.mode!=='senior'&&!k.off);
  L.forEach(k=>{k.save={mode:k.mode,x:k.x,y:k.y,face:k.face};if(k.bub){k.bub.remove();k.bub=null}});
  chime();
  const vis=L.filter(k=>{const [x,y]=toScreen(k.x,k.y),r=stage.getBoundingClientRect();return x>0&&x<r.width&&y>0&&y<r.height*.85});
  const a=pick(vis.length?vis:L);
  L.forEach(k=>{const w=doorWay(k);k.bway=[...w.slice(0,-1).reverse(),homeOf(k)];k.way=w;k.mode='go'});
  /* 여자 선생님 — '교실 들어가!' 하고 길을 따라 성실관 현관(t3)으로 가서 들어감. 선생님이 없으면 학생이 '빨리 가자!' */
  const T=freeT(TF);
  /* 현관 앞에 닿으면 들어가지 않고 운동장 쪽을 보고 서서 학생들을 들여보냄(stepBell). 학생이 다 들어가면 다시 동상 쪽으로 (2026-10-29) */
  if(T){T.mode='tgo';T.way=tPath(nearTN(T),'t3').map(n=>TN[n]);T.then=k=>{if(bell&&bell.phase==='run'){k.mode='stand';k.face=1;setFrame(k,0,true);k.cheerT=1.5;k.cheerI=0}else k.mode='roam'};
    setTimeout(()=>{if(bell)say(T,'종 쳤다! 얼른 교실 들어가!',2.5)},700)}
  say(a,'수업 종이다!',2.5);const b=!T&&pick(vis.filter(k=>k!==a));if(b)setTimeout(()=>{if(bell&&b.mode==='go')say(b,'빨리 가자!',2)},700);
  bell={t:0,phase:'run',L,T};
}
function stepBell(dt){
  const B=bell;B.t+=dt;
  if(B.phase==='run'){
    for(const k of B.L)if(k.mode==='go'&&(!k.way.length||B.t>14)){k.mode='in';k.el.style.opacity=0;if(k.bub){k.bub.remove();k.bub=null}}
    /* 여자 선생님 — 현관 앞에서 손짓하며 2.6초쯤마다 독려 */
    const T=B.T;
    if(T&&T.mode==='stand'){T.cheerT-=dt;setFrame(T,T.cheerT>1.8?5:0,T.face>0);
      if(T.cheerT<=0){T.cheerT=2.6;if(!T.bub)say(T,BELLSAY[T.cheerI++%BELLSAY.length],2.2)}}
    if(B.L.every(k=>k.mode==='in')){B.phase='in';B.t=0;teacherBack(T)}
    return;
  }
  if(B.phase==='in'&&B.t>7){                    /* 쉬는 시간 — 한 명씩 차례로 나옴 */
    B.phase='out';B.t=0;B.L.forEach((k,i)=>setTimeout(()=>{if(!bell)return;k.el.style.opacity=1;k.mode='back';k.way=k.bway;
      if(i===0)say(k,'쉬는 시간이다!',2.5)},i*250));
    return;
  }
  if(B.phase==='out'&&B.t>1&&B.L.every(k=>k.mode!=='back'&&k.mode!=='in'))bell=null;
}

/* ── 숨은 재미 ⑤ 100주년 기념사진 — 설립자 동상을 연달아 세 번(TAPS) 누르면 '기념사진 찍자!' 하고 가장 가까운 10명이
   동상 앞 계단·잔디에 두 줄로 서고, 1명은 그 앞 운동장 가장자리에서 뒷모습으로 서서 사진을 찍음
   ('하나, 둘, 셋!' → 찰칵 + 화면 번쩍 → 손 흔들기). 카메라는 몸에 가려 안 보이게 — 새 그림 없이 (2026-10-25) ── */
/* 모두 동상과 같은 5시 방향(서기 그림을 좌우로 뒤집은 쪽)을 보고, 찍는 사람은 그 시선 앞(무리의 오른쪽 아래)에서 11시 방향을 봄 (2026-10-25 사용자 요청) */
/* 줄은 '/' 방향(왼쪽 아래 → 오른쪽 위)으로 5명씩 — 앞줄은 뒷줄에서 5시 쪽으로 한 칸. 오른쪽 벤치(x 711~741, y ~333)는 피함 */
const PHOTO={rows:[0,1,2,3,4].flatMap(i=>[[652+i*11,359-i*5.5]]).concat([0,1,2,3,4].map(i=>[660+i*11,369-i*5.5])),cam:[720,400]};
let photo=null;
function shutter(){                            /* 찰칵 — 짧은 잡음 두 번, 작게 */
  try{const C=ac();if(!C||C.state!=='running')return;
    for(const [t,len] of [[0,.03],[.07,.05]]){const n=C.sampleRate*len|0,b=C.createBuffer(1,n,C.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
      const s=C.createBufferSource(),g=C.createGain();g.gain.value=.2;s.buffer=b;s.connect(g).connect(C.destination);s.start(C.currentTime+t)}}catch(e){}
}
function flash(){const f=document.createElement('div');f.style.cssText='position:absolute;inset:0;background:#fff;opacity:.85;z-index:3;pointer-events:none;transition:opacity .6s';
  $('stage').appendChild(f);setTimeout(()=>f.style.opacity=0,60);setTimeout(()=>f.remove(),800)}
function groupPhoto(){
  if(busy())return;found('photo');
  const C=[660,350],free=pupils().filter(k=>!k.off&&!['senior','in','go','back'].includes(k.mode));
  free.sort((a,b)=>Math.hypot(a.x-C[0],a.y-C[1])-Math.hypot(b.x-C[0],b.y-C[1]));
  /* 찍는 사람 — 여자 선생님 (2026-10-29). 선생님이 없으면 예전처럼 뒷모습 서기 칸(7)이 있는 학생 */
  const T=freeT(TF),M=free.slice(0,10),cam=T||free.slice(10).find(k=>k.n>=10)||M.pop();
  const L=[...M,cam];
  L.forEach(k=>{k.save={mode:k.mode,x:k.x,y:k.y,face:k.face};if(k.bub){k.bub.remove();k.bub=null}});
  M.forEach((k,i)=>{const p=PHOTO.rows[i];k.spot=p;k.mode='go';k.way=routeTo(k.x,k.y,p[0],p[1])});
  /* 선생님은 잔디 길(g3)까지 길을 따라 온 뒤 찍는 자리로 */
  cam.spot=PHOTO.cam;cam.way=T?[...tPath(nearTN(T),'g3').map(n=>TN[n]),PHOTO.cam]:routeTo(cam.x,cam.y,PHOTO.cam[0],PHOTO.cam[1]);cam.mode='go';
  say(cam,T?'다들 모여! 기념사진 찍자!':'기념사진 찍자!',2.5);
  photo={t:0,phase:'gather',M,cam,L};
}
function stepPhoto(dt){
  const P=photo;P.t+=dt;
  if(P.phase==='gather'){
    if(P.L.every(k=>k.mode!=='go'||!k.way.length)||P.t>15){
      P.phase='pose';P.t=0;
      for(const k of P.M){[k.x,k.y]=k.spot;k.mode='photo';k.face=1;k.spr.style.marginBottom='0px';setFrame(k,0,k.face>0);place(k)}
      const c=P.cam;[c.x,c.y]=c.spot;c.mode='photo';c.spr.style.marginBottom='0px';setFrame(c,c.n>=10?7:3,true);place(c);   /* 뒷모습 그림은 1시 방향 → 뒤집어 11시(친구들 쪽) */
    }
    return;
  }
  if(P.phase==='pose'){                         /* 하나, 둘, 셋! → 찰칵 */
    const c=P.cam,cue=[[.4,'하나,'],[1.2,'둘,'],[2,'셋!']];
    for(const [t,w] of cue)if(P.t>=t&&P.t-dt<t)say(c,w,.9,true);
    if(P.t>=2.7){P.phase='snap';P.t=0;shutter();flash();for(const k of P.M)setFrame(k,5,k.face>0)}
    return;
  }
  if(P.phase==='snap'&&P.t>2.2){
    P.phase='back';P.t=0;say(pick(P.M),'잘 나왔다!',2);
    for(const k of P.L){const to=homeOf(k);k.mode='back';k.way=routeTo(k.x,k.y,to[0],to[1])}
    return;
  }
  if(P.phase==='back'&&P.L.every(k=>k.mode!=='back'))photo=null;
}

/* ── 계절을 바꾸면 화면에 보이는 학생 두 명이 그 계절에 맞는 한마디 (2026-10-25) ── */
const SEASAY={봄:['꽃 폈다!','와, 봄이다!'],여름:['와, 덥다!','여름이다!'],가을:['단풍 예쁘다!','가을이다!'],겨울:['눈이다!','와, 눈 온다!']};
function seasonCheer(s){
  const r=stage.getBoundingClientRect();
  const V2=pupils().filter(k=>!k.off&&!k.bub&&!['in','go','back','race','photo','senior','rain','snow'].includes(k.mode)&&(()=>{const [x,y]=toScreen(k.x,k.y);
    return x>r.width*.08&&x<r.width*.92&&y>r.height*.15&&y<r.height*.8})());
  const a=pick(V2),b=pick(V2.filter(k=>k!==a&&Math.hypot(k.x-a.x,k.y-a.y)>60));
  if(a)say(a,SEASAY[s][0],2.2);if(b)setTimeout(()=>{if(!b.bub)say(b,SEASAY[s][1],2.2)},600);
}

/* ── 고양이가 달아날 때 가까이 있던 학생 한두 명이 '고양이다!' 하며 몇 걸음 따라가다 멈춤 (2026-10-25) ── */
function chaseCat(){
  const N=kids.filter(k=>!k.off&&['path','field'].includes(k.mode)&&Math.hypot(k.x-cat.x,k.y-cat.y)<150)
    .sort((a,b)=>Math.hypot(a.x-cat.x,a.y-cat.y)-Math.hypot(b.x-cat.x,b.y-cat.y)).slice(0,2);
  N.forEach((k,i)=>{const dx=cat.x-k.x,dy=cat.y-k.y,d=Math.max(1,Math.hypot(dx,dy)),m=Math.min(25,d*.6);
    k.chaseM=k.mode;k.mode='chase';k.cw=0;k.way=[[k.x+dx/d*m,k.y+dy/d*m]];
    if(k.bub){k.bub.remove();k.bub=null}setTimeout(()=>say(k,i?'어디 가!':'고양이다!',1.8),i*500)});
}
/* 평소에도 — 고양이 근처(130px)를 지나가거나 벤치에 앉은 학생이 가끔 고양이를 알아봄. 너무 잦지 않게 20초에 한 번까지.
   걷던 학생은 고양이 쪽으로 한두 걸음 가서 바라보고, 앉은 학생은 앉은 채로 말만 (2026-10-25 사용자: 발견이 너무 적다) */
const SPOTCAT=['어? 고양이다!','고양이 귀엽다!','야옹아, 안녕!','와, 삼색 고양이다!'];
let spotT=8;
function stepSpotCat(dt){
  spotT-=dt;if(spotT>0||!cat||!['walk','sit','sleep'].includes(cat.state)||busy())return;spotT=1;
  const N=kids.filter(k=>!k.off&&!k.bub&&['path','field','sit'].includes(k.mode)&&Math.hypot(k.x-cat.x,k.y-cat.y)<130);
  if(!N.length)return;
  const k=N.reduce((a,b)=>Math.hypot(a.x-cat.x,a.y-cat.y)<Math.hypot(b.x-cat.x,b.y-cat.y)?a:b);spotT=20;
  say(k,pick(SPOTCAT),2.2);if(k.mode==='sit')return;
  const dx=cat.x-k.x,dy=cat.y-k.y,d=Math.max(1,Math.hypot(dx,dy)),m=Math.min(10,d*.3);
  k.chaseM=k.mode;k.mode='chase';k.cw=0;k.way=[[k.x+dx/d*m,k.y+dy/d*m]];
}
function stepChase(k,dt){                      /* 따라가다 → 1.5초 멈춰 바라보기 → 하던 일로 */
  if(k.cw>0){k.cw-=dt;if(k.cw<=0){k.mode=k.chaseM;k.wait=.5}}
  else if(walkWay(k,dt,2)){k.cw=1.5;k.face=cat.x>k.x?1:-1;setFrame(k,0,k.face>0);k.spr.style.marginBottom='0px'}
  place(k);
}

/* 큰 놀이(체육대회·수업 종·기념사진·소나기·눈싸움)는 한 번에 하나만 (운동장 술래잡기는 2026-10-25 사용자 요청으로 뺌) */
const busy=()=>!!(sports||bell||photo||rain||snow);
const leads=()=>new Set(kids.filter(k=>k.lead).map(k=>k.lead));   /* 따라 걷는 친구가 있는 학생 — 놀이에 데려가면 친구가 따라와 어수선해서 뺌 */
function joinable(k){return !k.tch&&!k.off&&!['senior','in','go','back','chase'].includes(k.mode)&&k.mode!=='follow'&&!leads().has(k)}
function startGame(L){L.forEach(k=>{k.save={mode:k.mode,x:k.x,y:k.y,face:k.face};if(k.bub){k.bub.remove();k.bub=null}})}
function endGame(L){for(const k of L){const to=homeOf(k);k.mode='back';k.spr.style.marginBottom='0px';k.way=routeTo(k.x,k.y,to[0],to[1])}}

/* ── 숨은 재미 ⑦ 소나기 — 창조관 앞 차양을 연달아 세 번(TAPS) 누르면 비가 내리고 학생들이 '비다!' 하며 차양 기둥 앞(처마 밑)으로 뛰어가 비를 피함.
   14초 뒤 비가 그치면 '비 그쳤다!' 하고 흩어짐. 겨울엔 없음(눈이 오고 있어서) (2026-10-25) ── */
const CANOPY=[[835,252],[1130,405]];          /* 차양 지붕 — 누르는 곳은 이 선 둘레 16px */
/* 비 피하는 자리 — 차양 앞 기둥 바깥 계단에 한 줄, 최대 12자리. 차양에 가까운 학생만 옴 (2026-10-25)
   너무 반듯하지 않게 비가 올 때마다 새로: 간격 17~26px(17 보다 가까우면 겹침), 기둥선에서 9~15px 앞
   (9px 보다 안쪽이면 머리끝이 지붕 가장자리 위로 튀어나옴 — 그림 속 차양 높이 약 23px < 학생 키 약 32px).
   지붕 아래 안줄도 있었지만 앞줄과 겹쳐 보여서 뺌 */
function rainSpots(){const S=[];for(let x=848+rnd()*6;x<1086&&S.length<12;x+=17+rnd()*9)S.push([x,CANOPY_YF(x)+9+rnd()*6]);return S}
let rain=null;
function nearCanopy(x,y){const [[ax,ay],[bx,by]]=CANOPY,t=Math.max(0,Math.min(1,((x-ax)*(bx-ax)+(y-ay)*(by-ay))/((bx-ax)**2+(by-ay)**2)));
  return Math.hypot(x-(ax+(bx-ax)*t),y-(ay+(by-ay)*t))<16}
function rainFx(on){
  let r=$('rain');
  if(!r){r=document.createElement('div');r.id='rain';for(let i=0;i<160;i++){const e=document.createElement('i');
    e.style.cssText=`left:${rnd()*115}%;animation-duration:${.55+rnd()*.35}s;animation-delay:${-rnd()}s;opacity:${.45+rnd()*.4}`;r.appendChild(e)}
    $('stage').appendChild(r)}
  requestAnimationFrame(()=>r.classList.toggle('on',on));
}
function startRain(){
  if(busy()||SEA==='겨울')return;found('rain');
  rainFx(true);
  /* 차양에 가까운 학생부터 자리 수만큼 — 나머지는 하던 일 그대로 */
  const S=rainSpots(),near=k=>Math.min(...S.map(p=>Math.hypot(p[0]-k.x,p[1]-k.y)));
  const L=kids.filter(joinable).sort((a,b)=>near(a)-near(b)).slice(0,S.length);startGame(L);
  L.forEach(k=>{const j=S.reduce((bi,p,i)=>Math.hypot(p[0]-k.x,p[1]-k.y)<Math.hypot(S[bi][0]-k.x,S[bi][1]-k.y)?i:bi,0),p=S.splice(j,1)[0];
    k.spot=p;k.mode='go';k.way=routeTo(k.x,k.y,p[0],p[1])});
  const r=stage.getBoundingClientRect(),V2=L.filter(k=>{const [x,y]=toScreen(k.x,k.y);return x>0&&x<r.width&&y>0&&y<r.height*.85});
  /* 남자 선생님 — '처마 밑으로 피해!' 하고 차양 동쪽 끝 기둥 앞으로. 선생님이 없으면 학생이 '빨리 피하자!' */
  const T=freeT(TM);
  if(T){T.mode='tgo';T.way=routeTo(T.x,T.y,...TSHELTER());T.then=k=>{k.mode='stand';k.face=-1;setFrame(k,0,false)};
    setTimeout(()=>{if(rain)say(T,'비 온다! 얼른 처마 밑으로 피해!',2.6)},600)}
  const a=pick(V2.length?V2:L);say(a,'비다!',2);const b=!T&&pick(V2.filter(k=>k!==a));if(b)setTimeout(()=>{if(rain&&!b.bub)say(b,'빨리 피하자!',2)},600);
  rain={t:0,phase:'run',L};
}
function stepRain(dt){
  const R=rain;R.t+=dt;
  if(R.phase==='run'){
    /* 도착하면 보는 방향 제각각 — 반은 앞(왼쪽 아래), 나머지는 가장 가까운 친구 쪽이나 오른쪽 */
    for(const k of R.L)if(k.mode==='go'&&!k.way.length){k.mode='rain';k.spr.style.marginBottom='0px';
      const nb=R.L.filter(o=>o!==k&&o.mode==='rain').sort((a,b)=>Math.hypot(a.x-k.x,a.y-k.y)-Math.hypot(b.x-k.x,b.y-k.y))[0],q=rnd();
      k.face=q<.5?-1:q<.8&&nb?(nb.x>k.x?1:-1):1;setFrame(k,0,k.face>0);place(k)}
    const W=R.L.filter(k=>k.mode==='rain');
    for(const k of W)if(rnd()<dt*.12){k.face=-k.face;setFrame(k,0,k.face>0)}   /* 기다리는 동안 가끔 두리번 */
    for(const [t,w] of [[7,'비 언제 그치지?'],[10,'우산 가져올걸']])if(R.t>=t&&R.t-dt<t&&W.length){const k=pick(W);if(!k.bub)say(k,w,2.2,true)}
    if(R.t>14){R.phase='clear';R.t=0;rainFx(false);if(W.length)say(pick(W),'비 그쳤다!',2)}
    return;
  }
  if(R.phase==='clear'&&R.t>1.5){R.phase='back';endGame(R.L);teacherBack(TM);return}
  if(R.phase==='back'&&R.L.every(k=>k.mode!=='back'))rain=null;
}

/* ── 숨은 재미 ⑧ 겨울 눈싸움 — 겨울에 눈사람을 연달아 세 번(TAPS) 누르면 가까운 6명이 눈사람 양옆으로 3명씩 갈라 서서
   하얀 눈뭉치를 주고받음. 맞으면 가끔 '앗 차가워!'. 7초 뒤 '재밌었다!' 하고 하던 일로 (2026-10-25, 14초 → 7초) ── */
const SNOWTEAM=[[[716,352],[729,345],[742,353]],[[792,338],[803,324],[810,347]]];   /* 왼편은 오른쪽 벤치(711~741, ~333) 앞 */
let snow=null;
function startSnow(){
  if(busy()||SEA!=='겨울')return;found('snow');
  const C=[765,335],L=kids.filter(joinable).sort((a,b)=>Math.hypot(a.x-C[0],a.y-C[1])-Math.hypot(b.x-C[0],b.y-C[1])).slice(0,6);
  if(L.length<6)return;startGame(L);
  L.forEach((k,i)=>{k.team=i%2;const p=SNOWTEAM[k.team][i>>1];k.spot=p;k.mode='go';k.way=routeTo(k.x,k.y,p[0],p[1])});
  say(L[0],'눈싸움하자!',2);
  snow={t:0,phase:'gather',L,balls:[],next:.5};
}
function throwSnow(S){
  const A=S.L.filter(k=>k.cool<=0||k.cool===undefined),f=pick(A.length?A:S.L),T=S.L.filter(k=>k.team!==f.team),t=pick(T);
  f.cool=.9;setFrame(f,5,f.face>0);setTimeout(()=>{if(snow&&f.mode==='snow')setFrame(f,0,f.face>0)},350);
  const el=document.createElement('div');el.className='snowball';$('world').appendChild(el);
  S.balls.push({el,x0:f.x,y0:f.y-22,x1:t.x+(rnd()-.5)*6,y1:t.y-16,t:0,d:.55,to:t});
}
function stepSnow(dt){
  const S=snow;S.t+=dt;
  for(let i=S.balls.length-1;i>=0;i--){const b=S.balls[i];b.t+=dt;const f=Math.min(1,b.t/b.d),x=b.x0+(b.x1-b.x0)*f,y=b.y0+(b.y1-b.y0)*f-Math.sin(f*Math.PI)*16;
    b.el.style.transform=`translate(${x-1.6}px,${y-1.6}px)`;b.el.style.zIndex=Math.round(Math.max(b.y0,b.y1)+20);
    if(f>=1){b.el.remove();S.balls.splice(i,1);const k=b.to;if(k.mode==='snow'){k.el.classList.remove('hop');void k.el.offsetWidth;k.el.classList.add('hop');
      if(rnd()<.3&&!k.bub)say(k,pick(['앗 차가워!','으, 차가워!','맞았다!']),1.4,true)}}}
  if(S.phase==='gather'){
    if(S.L.every(k=>k.mode!=='go'||!k.way.length)||S.t>15){S.phase='fight';S.t=0;
      for(const k of S.L){[k.x,k.y]=k.spot;k.mode='snow';k.face=k.team?-1:1;k.cool=rnd()*.8;k.spr.style.marginBottom='0px';setFrame(k,0,k.face>0);place(k)}}
    return;
  }
  if(S.phase==='fight'){
    for(const k of S.L)k.cool-=dt;S.next-=dt;if(S.next<=0){S.next=.35+rnd()*.4;throwSnow(S)}
    if(S.t>4.2){S.phase='back';                 /* 7초 → 4.2초 (2026-10-29 사용자 요청, 40% 줄임) */say(pick(S.L),'재밌었다!',2);setTimeout(()=>{if(snow)endGame(S.L)},600)}
    return;
  }
  if(S.phase==='back'&&!S.balls.length&&S.L.every(k=>k.mode!=='back'&&k.mode!=='snow'))snow=null;
}

   같은 것은 한 번만 알리고, 1분 동안 아무도 안 만져 처음 모습으로 돌아갈 때 다시 처음부터 ── */

  rain:'소나기',snow:'눈싸움'};
const got=new Set();let toastT=null;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),3500)}
/* 오른쪽 위 '숨은 재미 ○ / 8 찾음' — 2026-10-24 에 개수 표시를 뺐다가 2026-10-29 사용자 요청으로 다시 (도전 의식) */
function showFuns(pop){
  const n=got.size,all=Object.keys(FUNS).length;$('funN').textContent=n;$('funAll').textContent=all;
  $('funDots').innerHTML=Array.from({length:all},(_,i)=>`<i${i<n?' class="on"':''}></i>`).join('');
  if(pop){const e=$('funs');e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
}
function found(k){if(got.has(k))return;got.add(k);showFuns(true);
  toast(got.size===Object.keys(FUNS).length?'숨은 재미를 모두 찾았어요!':`숨은 재미 발견! '${FUNS[k]}'`)}

/* 걸음 그림 — 아래로 가면 앞모습(걷기A·서기·걷기B·서기), 위로 가면 뒷모습(걷기A·B). iv = 한 발 시간 */
function walkFrame(k,dy,iv){
  const L=k.face<0,f4=Math.floor(k.ph/iv)%4;
  /* 위로 갈 때 — 뒷모습 서기가 있으면 아래로 갈 때처럼 걷기A·서기·걷기B·서기(칸 8·7·9·7), 없으면 옛 뒷모습 두 장 */
  if(dy>=0)setFrame(k,[1,0,2,0][f4],!L);else setFrame(k,k.n>=10?[8,7,9,7][f4]:f4<2?3:4,L);
  k.spr.style.marginBottom=(f4%2?0:1.2)+'px';
}
/* 트랙 달리기 고리 — 운동장 동쪽, 조회대와 겹치지 않는 작은 타원 */
const JOG={cx:968,cy:474,a:112,b:46,ang:21.3*Math.PI/180};
function jogAt(t){const u=Math.cos(t)*JOG.a,v=Math.sin(t)*JOG.b;
  return [JOG.cx+u*Math.cos(JOG.ang)-v*Math.sin(JOG.ang),JOG.cy+u*Math.sin(JOG.ang)+v*Math.cos(JOG.ang)]}

   누르기가 아닌 끌기로 쳐져 학생 터치가 안 먹었음 (2026-10-31 키오스크: 계절·마우스는 되는데 닫기·학생 터치가 안 됨) */
const TAPR=()=>Math.max(18,innerWidth*.012);
let lastUp={t:-1e9,tapped:false,moved:false};
function endPtr(e){
  const p=ptr.get(e.pointerId);if(!p)return;ptr.delete(e.pointerId);if(ptr.size<2)g2=null;
  const wasMulti=multi;if(!ptr.size){stage.classList.remove('drag');multi=false;
    if(raf){cancelAnimationFrame(raf);raf=0}layout();live(false)}
  const moved=wasMulti||Math.hypot(e.clientX-p.x0,e.clientY-p.y0)>=TAPR();
  const ok=!moved&&performance.now()-p.t<700;
  lastUp={t:performance.now(),tapped:ok,moved};
  if(ok)tap(e.clientX,e.clientY);
}
stage.addEventListener('pointerup',endPtr);stage.addEventListener('pointercancel',endPtr);
/* 보조 경로 — 키오스크 터치에서 pointerup 으로 누르기가 잡히지 않아도, 계절 버튼처럼 click 은 들어오므로 click 으로 한 번 더 받음.
   방금 pointerup 으로 처리했거나 끌기였으면 건너뜀 (같은 누르기를 두 번 처리하지 않게) */
stage.addEventListener('click',e=>{
  if(performance.now()-lastUp.t<800&&(lastUp.tapped||lastUp.moved))return;
  ping();tap(e.clientX,e.clientY);
});
stage.addEventListener('wheel',e=>{e.preventDefault();V.z*=e.deltaY>0?1/1.1:1.1;layout();ping()},{passive:false});
['contextmenu','selectstart','dragstart','gesturestart'].forEach(t=>window.addEventListener(t,e=>e.preventDefault(),true));
function tap(sx,sy){eggUsed=false;tapAt(sx,sy);if(!eggUsed){eggKey=null;eggN=0}}
function tapAt(sx,sy){
  /* 학생 먼저 — 손가락 둘레 화면 폭 2.5% 안의 가장 가까운 학생 */
  const r=stage.getBoundingClientRect(),lim=Math.max(r.width*.025,24);let best=null,bd=1e9;
  for(const k of kids){if(k.mode==='in'||k.off)continue;const s=scaleAt(k.y),[x,y]=toScreen(k.x,k.y-(k.h||KH)*.5*s);const d=Math.hypot(x+r.left-sx,y+r.top-sy);if(d<lim&&d<bd){bd=d;best=k}}
  /* 옛 선배가 손가락 둘레에 있으면 옆을 지나는 학생보다 선배가 먼저 대답 — 선배 멘트(OLDSAY)만 나오게 */
  if(senior&&!senior.dead){const s=scaleAt(senior.y),[x,y]=toScreen(senior.x,senior.y-KH*.5*s);const d=Math.hypot(x+r.left-sx,y+r.top-sy);if(d<lim){bd=d;best=senior}}
  /* 조회대·기념관 위를 누를 때는 학생·고양이 몸을 거의 정확히 누른 경우만 학생·고양이로 (근처를 지나는 학생이 터치를 가로채지 않게) */
  const [wx,wy]=toWorld(sx,sy),i=SPOTS.findIndex(S=>wx>=S[1]&&wx<=S[3]&&wy>=S[2]&&wy<=S[4]);
  const onEgg=inStage(wx,wy)||(i>=0&&(SPOTS[i][0]==='기념관'||SPOTS[i][0].startsWith('설립자'))),near=lim*(onEgg?.4:1);
  if(cat&&cat.state!=='gone'){const [x,y]=toScreen(cat.x,cat.y-CATH*.5*scaleAt(cat.y));const d=Math.hypot(x+r.left-sx,y+r.top-sy);if(d<near&&(!best||d<bd))return pokeCat()}
  if(best&&bd<near)return poke(best);
  if(tapProp(wx,wy))return;
  if(inStage(wx,wy))return;                                            /* 조회대 — 이름은 안 띄움 */
  /* 운동장 빈 곳 — 체육대회 달리기 (2026-10-25 조회대 → 운동장). 학생 가까이(터치 범위 1.6배 안)를 누른 건 세지 않음 —
     움직이는 운동장 학생을 누르려다 빗나간 터치가 쌓여 체육대회가 시작되는 일이 있었음 */
  if(inField(wx,wy)){if(best&&bd<lim*1.6)return;return egg('field',TAPS,startSports)}
  if(nearCanopy(wx,wy))return egg('canopy',TAPS,startRain);           /* 창조관 앞 차양 — 소나기 (겨울 빼고) */
  if(i>=0){labUntil[i]=performance.now()+3000;if(SPOTS[i][0]==='기념관')egg('hanok',TAPS,summonSenior);if(SPOTS[i][0]==='성실관')egg('bell',TAPS,ringBell);
    if(SPOTS[i][0].startsWith('설립자'))egg('photo',TAPS,groupPhoto)}
}
function stepOverlay(dt){
  /* 말풍선 꼬리(.bub::after, 0.9vw)만큼 더 올려서 꼬리 끝이 머리 위에 오게 — 꼬리가 고양이·학생을 가리지 않게 */
  const now=performance.now(),TAIL=U()*.9;
  SPOTS.forEach((S,i)=>{const on=now<labUntil[i];labs[i].classList.toggle('on',on);
    const [x,y]=toScreen((S[1]+S[3])/2,S[5]??S[2]+10);labs[i].style.left=x+'px';labs[i].style.top=y+'px'});
  if(cat&&cat.bub){const s=scaleAt(cat.y),g=cat.bub.classList.contains('grrimg'),[x,y]=toScreen(cat.x,cat.y-(g?CATH*.95:CATH+2)*s);
    cat.bub.style.left=x+'px';cat.bub.style.top=(y-(g?0:TAIL))+'px';
    cat.bubT-=dt;if(cat.bubT<.3)cat.bub.style.opacity=0;if(cat.bubT<=0){cat.bub.remove();cat.bub=null}}
  for(let i=pbubs.length-1;i>=0;i--){const p=pbubs[i],[x,y]=toScreen(p.x,p.y);p.b.style.left=x+'px';p.b.style.top=(y-TAIL)+'px';
    p.t-=dt;if(p.t<.3)p.b.style.opacity=0;if(p.t<=0){p.b.remove();pbubs.splice(i,1)}}
  for(const k of kids)if(k.bub){const s=scaleAt(k.y),[x,y]=toScreen(k.x,k.y-((k.h||KH)+2)*s);k.bub.style.left=x+'px';k.bub.style.top=(y-TAIL)+'px';
    k.bubT-=dt;if(k.bubT<.3)k.bub.style.opacity=0;if(k.bubT<=0){k.bub.remove();k.bub=null}}
}

/* 계절 버튼 — 바꾸면 그 계절 그림·교복·소품으로, 학생 두 명이 계절 한마디 */
SEAS.forEach(t=>{const b=document.createElement('button');b.textContent=t;
  b.onclick=()=>{const ch=t!==SEA;setSeason(t);ping();if(ch)seasonCheer(t)};$('seasons').appendChild(b)});

/* 키오스크 연결 · 60초 동안 손대지 않으면 처음 모습으로 */
let lastAct=performance.now(),homed=false;
function ping(){lastAct=performance.now();homed=false;if(parent!==window)parent.postMessage({lego:'active'},'*')}
function closeMe(){if(parent!==window)parent.postMessage({lego:'close'},'*');else location.href='index5.html'}
/* 닫기는 click 대신 손가락을 뗄 때 바로 — 터치에서는 손가락이 조금 밀리거나 오래 누르거나, 다른 손가락이 그림을 만지고 있으면
   click 이 생기지 않아 숨은 재미가 벌어지는 동안 닫기가 안 먹혔음 (2026-10-29). 버튼 둘레 2vw 안에서 떼면 닫힘 */
(()=>{const b=$('closeBtn');let down=null;
  b.addEventListener('pointerdown',e=>{down=e.pointerId;try{b.setPointerCapture(e.pointerId)}catch(_){}});
  b.addEventListener('pointerup',e=>{if(e.pointerId!==down)return;down=null;
    const r=b.getBoundingClientRect(),m=U()*2;
    if(e.clientX>r.left-m&&e.clientX<r.right+m&&e.clientY>r.top-m&&e.clientY<r.bottom+m)closeMe()});
  b.addEventListener('pointercancel',()=>down=null);
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')closeMe()});
  /* 보조 경로 — 키오스크 터치에서 pointerup 이 안 잡혀도 click 으로 닫힘 (두 번 불려도 index5 의 closeLego 가 한 번만 닫음, 2026-10-31) */
  b.addEventListener('click',closeMe);
  /* 키오스크 밖(웹에 올려 따로 열었을 때)에는 돌아갈 메뉴가 없으니 닫기 버튼을 숨김 (2026-10-30). 키오스크에선 늘 index5 안(iframe) */
  if(parent===window)b.style.display='none';
})();

window.addEventListener('resize',layout);
setSeason(SEA);buildKids();layout();showFuns();
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.06,(now-last)/1000);last=now;
  if(anim){for(const k of ['z','cx','cy'])V[k]+=(anim[k]-V[k])*.18;if(Math.abs(anim.z-V.z)<.002&&Math.abs(anim.cx-V.cx)<.5)anim=null;layout()}
  if(now-lastAct>60000&&!homed){homed=true;animTo(HOME.z,HOME.cx,HOME.cy);kids.forEach(k=>{if(k.bub){k.bub.remove();k.bub=null}});if(cat&&cat.bub){cat.bub.remove();cat.bub=null}if(cat&&cat.state==='gone')cat.t=0;got.clear();showFuns();
    if(SEA!==todaySeason())setSeason(todaySeason())}   /* 앞 관람객이 고른 계절도 오늘 계절로 (2026-10-25) */
  stepKids(dt);stepCat(dt);stepCritters(dt);stepOverlay(dt);
}
requestAnimationFrame(loop);
/* 성능 확인용 — 주소 끝에 ?fps 를 붙여 열면 왼쪽 아래에 1초당 그린 장면 수가 나옵니다(관람객 화면에는 안 보임) */
if(location.search.includes('fps')){
  const m=document.createElement('div');m.style.cssText='position:fixed;left:1vw;bottom:16vh;z-index:9;padding:.4vw .8vw;background:#000a;color:#0f0;font:600 1.4vw monospace;border-radius:.4vw;bottom:9vw';
  document.body.appendChild(m);let n=0,t0=performance.now(),worst=0,lt=t0;
  (function f(x){n++;worst=Math.max(worst,x-lt);lt=x;if(x-t0>=1000){m.textContent=n+' fps · 가장 늦은 장면 '+worst.toFixed(0)+'ms'+
    (AC?' · 소리 지연 '+Math.round(soundLag()*1000)+'ms (컴퓨터 '+Math.round((AC.outputLatency||AC.baseLatency||0)*1000)+' + TV '+Math.round(SOUND_TV*1000)+')':'');n=0;worst=0;t0=x}requestAnimationFrame(f)})(t0);
}
</script>
